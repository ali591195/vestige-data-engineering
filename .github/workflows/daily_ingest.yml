name: Daily Ingest

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

jobs:
  daily-ingest:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily ingestion
        env:
          AIVEN_PG_HOST: ${{ secrets.AIVEN_PG_HOST }}
          AIVEN_PG_PORT: ${{ secrets.AIVEN_PG_PORT }}
          AIVEN_PG_DATABASE: ${{ secrets.AIVEN_PG_DATABASE }}
          AIVEN_PG_USER: ${{ secrets.AIVEN_PG_USER }}
          AIVEN_PG_PASSWORD: ${{ secrets.AIVEN_PG_PASSWORD }}
        run: python -m src.pipelines.daily_ingest